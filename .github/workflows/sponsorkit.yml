name: Generate sponsors

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sponsorkit in workspace
        run: |
          npm init -y --silent
          npm install --silent sponsorkit

      - name: Generate sponsors SVGs
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_TOKEN }}
          SPONSORKIT_GITHUB_LOGIN: williamthome
        run: npx sponsorkit

      - name: Push to sponsorkit branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: sponsorkit
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
